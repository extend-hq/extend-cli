name: integration

# Integration tests cost real credits, so they only run on explicit
# dispatch. The base URL and key flow in via repo secrets
# (EXTEND_BASE_URL, EXTEND_API_KEY). If they are absent, the integration
# tests skip themselves. The run_ops gate is a dispatch input so the
# operator opts in per-run.
on:
  workflow_dispatch:
    inputs:
      run_ops:
        description: "Enable run-creating tests (extract/parse/classify/split/edit/workflow runs - costs credits)"
        type: boolean
        default: false

jobs:
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXTEND_BASE_URL: ${{ secrets.EXTEND_BASE_URL }}
      EXTEND_API_KEY: ${{ secrets.EXTEND_API_KEY }}
      EXTEND_TEST_RUN_OPS: ${{ inputs.run_ops && '1' || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: run integration tests
        working-directory: test/integration
        run: go test -count=1 -v -timeout 15m ./...
