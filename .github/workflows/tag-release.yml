name: tag-release

# Cut a new `v*` tag from main and push it. Pushing the tag is what
# triggers the existing `release.yml` workflow, which produces the
# cross-platform binaries, GitHub Release, and npm packages. Splitting
# tag-creation from artifact-build means an accidental tag is just a
# revert, not a half-published release.
#
# Manual dispatch only — we don't want a stray push to main to mint a
# version. Provide either a semver bump (patch/minor/major; the next
# version is computed from the latest `v*` tag) or an explicit version
# string when an out-of-band number is needed (release candidates,
# coordinated jumps, etc.).
#
# Step bodies live in `.github/scripts/` rather than inline so they
# can be exercised locally with the same env vars CI uses.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (or 'explicit' to use explicit_version)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - explicit
      explicit_version:
        description: "Explicit version (vX.Y.Z) — only used when bump=explicit"
        required: false
        type: string

permissions:
  contents: write   # needed to push the tag back

jobs:
  tag:
    name: tag and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so `git tag --list` sees every previous
          # release. The default shallow clone hides them.
          fetch-depth: 0

      - name: ensure dispatched from main
        run: .github/scripts/ensure-on-main.sh

      - name: compute next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.explicit_version }}
        run: .github/scripts/next-tag.sh

      - name: create and push tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: .github/scripts/push-tag.sh
