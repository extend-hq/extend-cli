name: test

on:
  push:
    branches: [main]
  pull_request:

# A push and the PR it creates would otherwise run the same workflow twice.
# Cancel any in-flight run for the same ref so we don't waste minutes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files (run 'gofmt -w'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: shellcheck
        run: shellcheck install.sh

      - name: go test
        run: go test -count=1 ./...

      - name: go test -race
        run: go test -count=1 -race ./...

  # The full unit suite again on macOS: install.sh's primary target is the
  # stock Mac (BSD userland, /bin/sh as bash 3.2, zsh present), and the
  # ubuntu job can't exercise any of that. This is also where the
  # login-shell behavioral test actually bites: zsh and bash are
  # guaranteed on the runner, so it proves a real login shell resolves the
  # installed binary after the profile write.
  test-macos:
    name: unit tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test -count=1 ./...

  # install.sh under busybox ash, the third /bin/sh family after dash
  # (ubuntu job) and bash-as-sh (macOS job), and exactly what `curl | sh`
  # hits inside Alpine-based images. The golang:alpine container has no
  # bash, which is the point; every step runs under plain sh.
  install-script-alpine:
    name: install script (busybox sh)
    runs-on: ubuntu-latest
    container: golang:alpine
    defaults:
      run:
        shell: sh
    steps:
      - name: install git
        run: apk add --no-cache git

      - uses: actions/checkout@v6

      - name: go test
        run: go test -count=1 -v -run TestInstallScript .

  # The integration module has its own go.mod and isn't reachable from `go
  # vet ./...` at the repo root. Vet it here so a syntax error or harness
  # break gets caught on every PR even though the tests themselves don't
  # run without env credentials. We use `go vet`, not `go test`, because
  # `go test` would invoke TestMain which builds the full CLI binary
  # (redundant with the cross-compile job below).
  integration-build:
    name: integration build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: vet integration module
        working-directory: test/integration
        run: go vet ./...

  # The evals/runner module (skill-eval harness) has its own go.mod and is
  # only otherwise exercised by the dispatch-only skill-evals workflow. Keep
  # it compiling, formatted, and unit-tested on every PR so harness changes
  # don't bit-rot. The unit tests here are pure (no network, no claude/codex
  # binaries) — the model-driving runs only happen under skill-evals.
  evals-build:
    name: evals runner build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        working-directory: evals/runner
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files in evals/runner (run 'gofmt -w'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: evals/runner
        run: go vet ./...

      - name: go build
        working-directory: evals/runner
        run: go build ./...

      - name: go test
        working-directory: evals/runner
        run: go test -count=1 ./...

  # Verify go.mod/go.sum are tidy in every module. Catches the common drift
  # where a dependency added via `go get` keeps a stale `// indirect` marker
  # (or an unused require lingers) because `go mod tidy` was never re-run.
  # The Go version is pinned via go-version-file so tidy output is
  # deterministic across runs.
  mod-tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: verify modules are tidy
        run: |
          set -euo pipefail
          for dir in . test/integration evals/runner; do
            echo "::group::go mod tidy ($dir)"
            (cd "$dir" && go mod tidy)
            echo "::endgroup::"
          done
          if ! git diff --exit-code; then
            echo "::error::go.mod/go.sum not tidy. Run 'go mod tidy' in each module (., test/integration, evals/runner) and commit the result."
            exit 1
          fi

  # Cross-compile the CLI binary for every supported platform. We don't run
  # the binary here — just verify the code compiles for each target.
  cross-compile:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath ./cmd/extend
